name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secrets
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/flask \
            --config=p/dockerfile \
            --config=p/github-actions \
            --config=p/secrets \
            --metrics=off \
            --error        
  sca:
    name: SCA + IaC (Trivy)
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.52.2
          trivy --version

      - name: Scan dependencies
        run: |
          trivy fs --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 .

      - name: Scan Dockerfile
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 . 
      - name: Scan for secrets
        run: gitleaks git . --redact --verbose
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start app
        run: |
          docker build -t devsecops-lab:test .
          docker network create zapnet
          docker run -d --name lab-app --network zapnet devsecops-lab:test

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network zapnet curlimages/curl:latest \
                 -sf http://lab-app:8080/health; then
              echo "App ready after $i attempts"
              exit 0
            fi
            sleep 2
          done
          docker logs lab-app
          exit 1

      - name: ZAP full scan
        run: |
          mkdir -p zap-out
          cp .zap/rules.tsv zap-out/
          chmod 777 zap-out
          docker run --rm --network zapnet \
            -v "$(pwd)/zap-out:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t http://lab-app:8080 \
              -r zap-report.html -c rules.tsv -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/zap-report.html 
      - name: Cleanup
        if: always()
        run: docker rm -f lab-app || true
